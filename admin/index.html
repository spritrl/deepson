<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DEEPSON · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0c;--ink-2:#141416;--ink-3:#1d1d20;
  --bone:#efebe6;--bone-dim:#a9a49e;--red:#c1121f;--red-deep:#7a0a12;
  --line:color-mix(in oklab,var(--bone) 14%,transparent);
  --display:"Anton","Impact",sans-serif;--sans:"Inter",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --pad:clamp(16px,4vw,48px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1;text-decoration:none}
.logo span{color:var(--red)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:none;transition:background .3s,color .3s,border-color .3s;white-space:nowrap}
.btn:hover{border-color:var(--bone)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--bone);border-color:var(--bone);color:var(--ink)}

/* Connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:var(--pad)}
.login form{width:min(100%,380px);display:flex;flex-direction:column;gap:18px;padding:36px 30px;border:1px solid var(--line);border-radius:10px;background:var(--ink-2)}
.login h1{font-family:var(--display);font-weight:400;font-size:40px;text-transform:uppercase;line-height:1}
.login h1 em{font-family:var(--serif);text-transform:none;color:var(--bone-dim);font-weight:400}
input,select{font:inherit;font-size:16px;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;color-scheme:dark}
input:focus,select:focus{outline:none;border-color:var(--red)}
.err{color:#ff6b6b;font-size:14px;min-height:1.2em}

/* Tableau de bord */
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;padding:14px var(--pad);background:color-mix(in oklab,var(--ink) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .left{display:flex;align-items:baseline;gap:14px}
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim)}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
main{padding:28px var(--pad) 60px;display:flex;flex-direction:column;gap:22px;max-width:1400px;margin-inline:auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:18px 18px 16px;border:1px solid var(--line);border-radius:10px;background:var(--ink-2)}
.kpi strong{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,3vw,44px);line-height:1.05;margin-top:6px}
.kpi strong em{font-style:normal;color:var(--red);font-size:.6em}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:20px;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel h2 small{font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--bone-dim);text-transform:none}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--bone-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:240px;display:block}
.chart text{fill:var(--bone-dim);font-size:11px;font-family:var(--sans)}
.bars{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto;padding-right:4px}
.bars li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.bars li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars li b{font-weight:600;font-variant-numeric:tabular-nums}
.bars li i{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bars li i::after{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--red-deep),var(--red))}
.bars li span em{font-style:normal;color:var(--bone-dim)}
.empty{color:var(--bone-dim);font-size:14px;padding:12px 0}
.stack{display:flex;flex-direction:column;gap:22px}

/* Demandes */
.filters{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--sans)}
.panel h2:has(.filters){flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim)}
.filters button[aria-pressed=true]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.reqs{list-style:none;display:flex;flex-direction:column}
.req{display:grid;grid-template-columns:110px 1.2fr 1.4fr 1fr 150px;gap:6px 18px;align-items:start;padding:16px 0;border-top:1px solid var(--line);font-size:14px}
.req small{display:block;color:var(--bone-dim);font-size:12px}
.req .who b{font-weight:600}
.req .who b{display:block}
.req .who a{display:inline-block;margin-top:4px;color:var(--bone-dim);text-decoration:none;word-break:break-all}
.req .who a:hover{color:var(--bone)}
.req .tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.req details{grid-column:2/-1;color:var(--bone-dim)}
.req details summary{cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.req details p{white-space:pre-wrap;margin-top:8px;color:var(--bone)}
.req select{padding:8px 10px;font-size:13px}
.req[data-status="nouvelle"] select{border-color:var(--red)}
.req[data-status="acceptée"] select{border-color:#3fa36b}
.req[data-status="refusée"]{opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.notice{padding:14px 16px;border:1px solid var(--red);border-radius:8px;background:color-mix(in oklab,var(--red) 12%,transparent);font-size:14px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .req{grid-template-columns:1fr 1fr}
  .req .when{grid-column:1/-1}
  .req details{grid-column:1/-1}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.req{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Connexion -->
<section class="login" id="login" hidden>
  <form id="loginForm">
    <a class="logo" href="/">DEEPSON<span>.</span></a>
    <h1>Espace <em>admin</em></h1>
    <label style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Mot de passe</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn btn-red" type="submit" style="justify-content:center">Se connecter</button>
  </form>
</section>

<!-- Tableau de bord -->
<div id="app" hidden>
  <header class="top">
    <div class="left"><a class="logo" href="/" target="_blank">DEEPSON<span>.</span></a><span class="eyebrow">Admin</span></div>
    <div class="right">
      <div class="seg" role="group" aria-label="Période">
        <button data-days="1" aria-pressed="false">Aujourd'hui</button>
        <button data-days="7" aria-pressed="false">7 j</button>
        <button data-days="30" aria-pressed="true">30 j</button>
        <button data-days="90" aria-pressed="false">90 j</button>
      </div>
      <button class="btn" id="refresh" title="Actualiser">↻</button>
      <button class="btn" id="logout">Déconnexion</button>
    </div>
  </header>

  <main>
    <p class="notice" id="notice" hidden></p>

    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Visites</span><strong id="k-visits">–</strong></div>
      <div class="kpi"><span class="eyebrow">Visiteurs uniques</span><strong id="k-visitors">–</strong></div>
      <div class="kpi"><span class="eyebrow">Clics</span><strong id="k-clicks">–</strong></div>
      <div class="kpi"><span class="eyebrow">Demandes</span><strong id="k-bookings">–</strong></div>
      <div class="kpi"><span class="eyebrow">Conversion</span><strong id="k-conv">–</strong></div>
    </div>

    <section class="panel">
      <h2>Activité <span class="legend"><span><i style="background:var(--bone-dim)"></i>Visites</span><span><i style="background:var(--red)"></i>Demandes</span></span></h2>
      <svg class="chart" id="chart" role="img" aria-label="Visites et demandes par jour"></svg>
    </section>

    <div class="grid2">
      <section class="panel">
        <h2>Clics <small id="clicksCount"></small></h2>
        <ul class="bars" id="clicks"></ul>
      </section>
      <div class="stack">
        <section class="panel"><h2>Sources</h2><ul class="bars" id="sources"></ul></section>
        <section class="panel"><h2>Appareils</h2><ul class="bars" id="devices"></ul></section>
      </div>
    </div>

    <section class="panel">
      <h2>Demandes de booking
        <span class="filters" id="reqFilters">
          <button data-s="all" aria-pressed="true">Toutes</button>
          <button data-s="nouvelle" aria-pressed="false">Nouvelles</button>
          <button data-s="en cours" aria-pressed="false">En cours</button>
          <button data-s="acceptée" aria-pressed="false">Acceptées</button>
          <button data-s="refusée" aria-pressed="false">Refusées</button>
        </span>
      </h2>
      <ul class="reqs" id="reqs"></ul>
    </section>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('fr-FR');
const STATUSES=['nouvelle','en cours','acceptée','refusée'];
let days=30,data=null,reqFilter='all';

const show=view=>{$('#login').hidden=view!=='login';$('#app').hidden=view!=='app'};

async function load(){
  const r=await fetch(`/api/admin/stats?days=${days}`,{credentials:'same-origin'});
  if(r.status===401){show('login');return}
  show('app');
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#notice').hidden=false;$('#notice').textContent='Erreur serveur : '+(j.error||r.status);return}
  $('#notice').hidden=true;
  data=j;render();
}

function bars(el,rows,fmt=l=>esc(l)){
  if(!rows.length){el.innerHTML='<li class="empty">Aucune donnée sur la période.</li>';return}
  const max=rows[0].count;
  el.innerHTML=rows.map(r=>`<li><span title="${esc(r.label)}">${fmt(r.label)}</span><b>${nf.format(r.count)}</b><i style="--w:${(r.count/max*100).toFixed(1)}%"></i></li>`).join('');
}

function chart(series){
  const svg=$('#chart'),W=svg.clientWidth||800,H=240,pl=34,pr=8,pt=12,pb=26;
  const max=Math.max(4,...series.map(s=>s.visits));
  const step=(W-pl-pr)/series.length,bw=Math.max(2,Math.min(28,step*.7));
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,Math.round(max/2),max];
  const maxLabels=Math.max(2,Math.floor((W-pl)/60)),every=Math.ceil(series.length/Math.min(8,maxLabels));
  let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" stroke-opacity=".1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('');
  series.forEach((s,i)=>{
    const x=pl+i*step+(step-bw)/2,d=new Date(s.day+'T12:00:00');
    const lbl=d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    g+=`<g><title>${lbl} : ${s.visits} visite(s), ${s.visitors} visiteur(s), ${s.clicks} clic(s), ${s.bookings} demande(s)</title>
      <rect x="${pl+i*step}" y="${pt}" width="${step}" height="${H-pt-pb}" fill="transparent"/>
      <rect x="${x}" y="${y(s.visits)}" width="${bw}" height="${Math.max(0,H-pb-y(s.visits))}" rx="2" fill="#a9a49e" fill-opacity=".55"/>
      ${s.bookings?`<circle cx="${x+bw/2}" cy="${Math.min(y(s.visits)-8,H-pb-8)}" r="${Math.min(6,3+s.bookings)}" fill="#c1121f"/>`:''}</g>`;
    if(i%every===0)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${lbl}</text>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.color='var(--bone)';svg.innerHTML=g;
}

function render(){
  const t=data.totals;
  $('#k-visits').textContent=nf.format(t.visits);
  $('#k-visitors').textContent=nf.format(t.visitors);
  $('#k-clicks').textContent=nf.format(t.clicks);
  $('#k-bookings').textContent=nf.format(t.bookings);
  $('#k-conv').innerHTML=t.visitors?`${(t.bookings/t.visitors*100).toLocaleString('fr-FR',{maximumFractionDigits:1})}<em>&nbsp;%</em>`:'–';
  chart(data.series);
  $('#clicksCount').textContent=data.clicks.length?`${data.clicks.length} éléments`:'';
  bars($('#clicks'),data.clicks,l=>{const i=l.indexOf(' · ');return i>0?`<em>${esc(l.slice(0,i))} ·</em> ${esc(l.slice(i+3))}`:esc(l)});
  bars($('#sources'),data.sources);
  const dv=[{label:'Mobile',count:data.devices.mobile||0},{label:'Ordinateur',count:data.devices.desktop||0}].filter(r=>r.count).sort((a,b)=>b.count-a.count);
  bars($('#devices'),dv);
  renderReqs();
}

function renderReqs(){
  const list=data.bookings.filter(b=>reqFilter==='all'||b.status===reqFilter);
  const counts=Object.fromEntries(STATUSES.map(s=>[s,data.bookings.filter(b=>b.status===s).length]));
  document.querySelectorAll('#reqFilters button').forEach(b=>{const s=b.dataset.s;if(s!=='all')b.textContent=`${b.textContent.replace(/ \(\d+\)$/,'')} (${counts[s]})`});
  if(!list.length){$('#reqs').innerHTML='<li class="empty">Aucune demande.</li>';return}
  $('#reqs').innerHTML=list.map(b=>{
    const recv=b.createdAt?new Date(b.createdAt):null;
    const ev=b.date?new Date(b.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',year:'numeric'}):'';
    return `<li class="req" data-id="${esc(b.id)}" data-status="${esc(b.status)}">
      <div class="when">${b.status==='nouvelle'?'<span class="dot"></span>':''}<small>Reçue</small>${recv?recv.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' · '+recv.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'–'}</div>
      <div class="who"><b>${esc(b.nom)}</b>${b.etablissement?`<small>${esc(b.etablissement)}</small>`:''}
        <a href="mailto:${esc(b.email)}?subject=${encodeURIComponent('DEEPSON · Votre demande de booking du '+(b.date||''))}">${esc(b.email)}</a>
        ${b.telephone?`<br><a href="tel:${esc(b.telephone.replace(/\s/g,''))}">${esc(b.telephone)}</a>`:''}</div>
      <div><span class="tag">${esc(b.type)}</span><br><b>${esc(ev)}</b>${b.horaires?` · ${esc(b.horaires)}`:''}<small>${esc(b.lieu)}</small></div>
      <div><small>Invités</small>${esc(b.invites||'Non précisé')}<small style="margin-top:6px">Budget</small>${esc(b.budget||'À discuter')}</div>
      <div><select aria-label="Statut">${STATUSES.map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></div>
      ${b.message?`<details><summary>Message</summary><p>${esc(b.message)}</p></details>`:''}
    </li>`}).join('');
}

/* Changement de statut */
$('#reqs').addEventListener('change',async e=>{
  if(e.target.tagName!=='SELECT')return;
  const li=e.target.closest('.req'),id=li.dataset.id,status=e.target.value,b=data.bookings.find(x=>x.id===id),prev=b.status;
  b.status=status;li.dataset.status=status;
  const r=await fetch('/api/admin/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
  if(r.status===401)return show('login');
  if(!r.ok){b.status=prev;alert('Impossible de mettre à jour le statut.')}
  renderReqs();
});

document.querySelectorAll('#reqFilters button').forEach(b=>b.addEventListener('click',()=>{
  reqFilter=b.dataset.s;document.querySelectorAll('#reqFilters button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderReqs();
}));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  days=+b.dataset.days;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));load();
}));
$('#refresh').addEventListener('click',load);
$('#logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});show('login')});
addEventListener('resize',()=>data&&chart(data.series));

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  const btn=e.target.querySelector('button');btn.disabled=true;
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})});
  btn.disabled=false;
  if(r.ok){e.target.reset();load()}else{const j=await r.json().catch(()=>({}));$('#loginErr').textContent=j.error||'Erreur de connexion'}
});

load();
</script>
</body>
</html>
